name: Security

on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_run:
    workflows: ["GML Code Scanner"]
    types: [completed]
  schedule:
    - cron: "17 18 * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: Triage again even if an earlier pull request covered these findings
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: write
  checks: read

concurrency:
  group: claude-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CLAUDE_APP: ${{ secrets.CLAUDE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        if: env.HAS_CLAUDE_APP == 'true'
        continue-on-error: true
        with:
          client-id: Iv23lizzdQw7rAtlQQsX
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: curl -fsSL https://github.com/Mackery6969/GML-Code-Scanner/releases/latest/download/gmlscan.mjs -o "$RUNNER_TEMP/gmlscan.mjs"
      - uses: Mackery6969/Claude-Autofix@v1
        with:
          task: security
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          force: ${{ inputs.force == true }}
          verify-command: node "$RUNNER_TEMP/gmlscan.mjs" PizzaTower_GM2 --config .gmlscan.json --rule gml/syntax-error --fail-on error --no-color
